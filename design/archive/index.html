<head>

<style>

<h1>Личная CRM — первый экран, мобильная ширина 390 px</h1>
<div class="grid">

  <figure><div class="frame"><iframe src="../mobile.html"></iframe></div><figcaption><b>2. Электрический синий</b>Manrope, стеклянные карточки</figcaption></figure>
  <figure><div class="frame"><iframe src="v3-dark.html"></iframe></div><figcaption><b>3. Ночь и лайм</b>Unbounded + Inter, тёмная тема</figcaption></figure>
