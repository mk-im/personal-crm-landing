<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Личная CRM — люди, которых вы знаете</title>
<meta name="description" content="Кто это, откуда знакомы, телефон, почта и о чём договорились. Заметка после разговора остаётся в карточке контакта.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Onest:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Variant 1: cream paper, editorial grotesk + mono */
  :root {
    --bg: #F3EFDF;
    --ink: #151515;
    --muted: #5E5B50;
    --line: #151515;
    --accent: #FF6A3D;
    --card: #FBF9F0;
    --font-head: "Onest", sans-serif;
    --font-mono: "IBM Plex Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #d8d4c4; display: flex; justify-content: center; }
  .screen {
    width: 390px; height: 844px; position: relative; overflow: hidden;
    background: var(--bg); color: var(--ink);
    padding: 20px 20px 0;
    display: flex; flex-direction: column;
  }
  .screen::before { /* thin inner frame, like the reference */
    content: ""; position: absolute; inset: 10px;
    border: 1px solid var(--line); opacity: .25; pointer-events: none;
  }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 8px 8px 16px; background: var(--bg);
  }
  .logo { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; }
  .logo i { width: 10px; height: 10px; background: var(--accent); border-radius: 2px; display: block; }
  .header .dots { display: flex; gap: 4px; padding-right: 8px; }
  .header .dots b { width: 5px; height: 5px; border-radius: 50%; background: var(--ink); display: block; }

  h1 {
    margin-top: 36px;
    font-family: var(--font-head); font-weight: 600; font-size: 45px; line-height: .98;
    letter-spacing: -.025em; text-transform: uppercase;
  }
  .sub {
    margin-top: 18px; max-width: 330px;
    font-family: var(--font-mono); font-size: 13px; line-height: 1.55; color: var(--muted);
  }
  .cta {
    margin-top: 24px; align-self: flex-start;
    display: inline-flex; align-items: center; gap: 14px;
    background: var(--ink); color: var(--bg); text-decoration: none;
    font-family: var(--font-head); font-weight: 600; font-size: 16px;
    padding: 8px 8px 8px 22px; border-radius: 999px;
  }
  .cta span {
    width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--ink);
    display: grid; place-items: center; font-size: 18px;
  }

  .panel {
    position: absolute; left: 20px; right: 20px; bottom: 20px; height: 232px;
    border: 1px solid var(--line); background: var(--card);
    font-family: var(--font-mono);
  }
  .panel-head {
    display: flex; justify-content: space-between; padding: 10px 14px;
    border-bottom: 1px solid var(--line); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
  }
  .panel-head em { font-style: normal; color: var(--accent); }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px dashed rgba(21,21,21,.35); }
  .row:last-child { border-bottom: 0; }
  .av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-head); font-weight: 600; font-size: 13px; border: 1px solid var(--line); flex: none; }
  .row .name { font-family: var(--font-head); font-weight: 600; font-size: 15px; }
  .row .meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .row .tag { margin-left: auto; font-size: 10px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; white-space: nowrap; }
  .row.hl { background: #FFE3D8; }
  .row.hl .tag { background: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>
<main class="screen">
  <header class="header">
    <div class="logo"><i></i>Личная CRM</div>
    <div class="dots"><b></b><b></b><b></b></div>
  </header>

  <h1>Не теряйте людей и контекст разговора</h1>
  <p class="sub">Список тех, кого вы знаете лично: кто это, откуда знакомы, телефон, почта и о чём договорились.</p>
  <a class="cta" href="#">Открыть приложение <span>↗</span></a>

  <section class="panel" aria-hidden="true">
    <div class="panel-head"><span>Контакты</span><em>● 1000</em></div>
    <div class="row hl">
      <div class="av" style="background:#FF6A3D">АМ</div>
      <div><div class="name">Анна Морозова</div><div class="meta">Митап по дизайну</div></div>
      <div class="tag">заметка</div>
    </div>
    <div class="row">
      <div class="av" style="background:#E9E2C7">ИЛ</div>
      <div><div class="name">Игорь Левин</div><div class="meta">Друг брата</div></div>
    </div>
    <div class="row">
      <div class="av" style="background:#E9E2C7">МС</div>
      <div><div class="name">Мария Седова</div><div class="meta">Соседка по даче</div></div>
    </div>
  </section>
</main>
</body>
</html>
