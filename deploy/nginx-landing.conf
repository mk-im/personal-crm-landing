server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name crmc.space;

    ssl_certificate /etc/letsencrypt/live/crmc.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crmc.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/personal-crm-landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name crmc.space;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
